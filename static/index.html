<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submission Review Assistant</title>
<style>
:root {
  --bg: #fbf9f5; --surface: #fffdf9; --panel: #f5f2eb; --well: #efece4; --ink: #111111; --ink-2: #3a3833; --muted: #6b6963; --faint: #a19e96;
  --line: #e4e0d6; --line-2: #d6d1c4; --hover: #f2eee5;
  --pass: #15803d; --pass-bg: #f0fdf4; --pass-ln: #bbf7d0; --flag: #b91c1c; --flag-bg: #fef2f2; --flag-ln: #fecaca;
  --unk: #b45309; --unk-bg: #fffbeb; --unk-ln: #fde68a; --gray: #57554f; --gray-bg: #efece4; --gray-ln: #ddd8cc;
  --ovr: #6b21a8; --ovr-bg: #faf5ff; --ovr-ln: #e9d5ff; --r: 3px;
  --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--r); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.015em; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); font-size: 12px; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); height: 53px;
  border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; height: 52px; padding: 0 32px; display: flex; align-items: center; gap: 10px; }
.mark { width: 18px; height: 18px; border-radius: 2px; background: var(--ink); display: grid; place-items: center; color: #fff; font: 700 10.5px/1 var(--sans); }
.brand { font-weight: 650; font-size: 14px; letter-spacing: -0.01em; }
.sep { color: var(--line-2); font-size: 14px; }
.brand-sub { color: var(--faint); font-size: 12px; }
.spacer { flex: 1; }
.model { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
.model .mk { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--pass); } .dot.bad { background: var(--flag); } .dot.warn { background: var(--unk); }

/* ---------- layout ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; }
@media (max-width: 980px) { .wrap { grid-template-columns: 1fr; padding: 20px 16px 60px; gap: 24px; } .side { position: static !important; } .top-in { padding: 0 16px; } .brand-sub { display: none; } }

/* ---------- packet panel ---------- */
@media (max-width: 980px) { body.has-result .side .collapsible { display: none; } body.has-result .side h2 { margin-bottom: 6px; } }
.side { position: sticky; top: 72px; align-self: start; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side h2 { font-size: 15px; margin: 6px 0 14px; }
.drop { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 22px 14px; text-align: center; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--ink); background: var(--hover); }
.drop b { display: block; font-weight: 600; font-size: 13.5px; }
.drop span { font-size: 12px; color: var(--muted); }
.files { list-style: none; margin: 10px 0 0; padding: 0; }
.files li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.files li:last-child { border-bottom: 0; }
.ext { font: 600 10px/1 var(--mono); text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--r); padding: 3px 4px; min-width: 34px; text-align: center; }
.files .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; cursor: pointer; color: var(--faint); font-size: 17px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--flag); }
.lbl { display: block; font-size: 12.5px; font-weight: 600; margin: 18px 0 6px; }
textarea, input[type=text] { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r); padding: 9px 11px; background: var(--surface); resize: vertical; }
textarea:focus, input[type=text]:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,17,17,.06); }
.side .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
.note { font-size: 11.5px; color: var(--faint); margin: 14px 0 0; line-height: 1.5; }

.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 550; font-size: 13.5px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2a2a28; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: var(--r); }
.btn.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); font-weight: 550; font-size: 13px; }
.btn.link:hover { text-decoration-color: var(--ink); background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border: 1px solid transparent; border-radius: 2px; font: 600 11px/1.5 var(--sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.PASS, .KNOWN { color: var(--pass); background: var(--pass-bg); border-color: var(--pass-ln) !important; }
.FLAG, .MISSING { color: var(--flag); background: var(--flag-bg); border-color: var(--flag-ln) !important; }
.UNKNOWN, .CONFLICT, .INVALID { color: var(--unk); background: var(--unk-bg); border-color: var(--unk-ln) !important; }
.NOT_EXTRACTED, .neutral { color: var(--gray); background: var(--gray-bg); border-color: var(--gray-ln) !important; }
.OVERRIDE { color: var(--ovr); background: var(--ovr-bg); border-color: var(--ovr-ln) !important; }
body { font-variant-numeric: tabular-nums; }

/* ---------- results ---------- */
.results { min-width: 0; display: grid; gap: 44px; }
.sec-hd { display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; flex-wrap: wrap; }
.sec-hd h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: -0.015em; }
.sec-hd .aside { color: var(--muted); font-size: 12.5px; }
.sec-hd .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.subnav { position: sticky; top: 53px; z-index: 5; background: var(--bg); display: flex; gap: 22px; padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: -24px; overflow-x: auto; }
.subnav a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 550; white-space: nowrap; }
.subnav a:hover { color: var(--ink); }
.subnav .cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: var(--r); background: var(--flag-bg); color: var(--flag); font-size: 11px; text-align: center; }

/* empty + processing */
.hero-empty { padding: 72px 0 24px; max-width: 640px; }
.hero-empty h1 { font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.08; letter-spacing: -0.025em; }
.hero-empty p { font-size: 16px; color: var(--ink-2); margin: 16px 0 0; max-width: 540px; }
.steps { list-style: none; padding: 0; margin: 36px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); }
.steps li { padding: 16px 16px 0 0; font-size: 13px; color: var(--ink-2); }
.steps .no { display: block; font: 500 12px/1 var(--mono); color: var(--faint); margin-bottom: 8px; }
.steps .st-t { display: block; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.steps .st-d { display: block; }
@media (max-width: 700px) { .steps { grid-template-columns: 1fr 1fr; } .hero-empty h1 { font-size: 34px; } }
.processing { padding: 56px 0; display: flex; gap: 16px; align-items: flex-start; }
.pipe { list-style: none; margin: 22px 0 0; padding: 0; border: 1px solid var(--line); background: var(--surface); max-width: 620px; position: relative; overflow: hidden; }
.pipe::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 30%; background: var(--ink); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }
.pipe li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.pipe li:last-child { border-bottom: 0; }
.pipe .no { font: 500 11.5px/1.7 var(--mono); color: var(--faint); }
.pipe .who { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); align-self: center; }
.pipe .who.llm { color: var(--ovr); }
.elapsed { font: 500 12px/1 var(--mono); color: var(--muted); margin-top: 10px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--line-2); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; flex: none; margin-top: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
.processing h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; }
.processing p { color: var(--muted); margin: 6px 0 0; }

/* status hero */
.status-top { display: flex; align-items: flex-end; gap: 16px 32px; flex-wrap: wrap; justify-content: space-between; }
.status .who-r { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink-2); }
.cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); }
.cell { padding: 14px 18px 16px; border-right: 1px solid var(--line); }
.cell:last-child { border-right: 0; }
.cell .lbl2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cell .num { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.cell .num b { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1; }
.cell .num span { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.cell .ex { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.cell.p .num { color: var(--pass); } .cell.f .num { color: var(--flag); } .cell.u .num { color: var(--unk); }
.cell.zero .num { color: var(--faint); }
@media (max-width: 560px) { .cells { grid-template-columns: 1fr; } .cell { border-right: 0; border-bottom: 1px solid var(--line); } .cell:last-child { border-bottom: 0; } }
.status { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-top: 8px; }
.status .k { margin-bottom: 8px; }
.status h1 { font-family: var(--serif); font-weight: 500; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em; }
.status.ready h1 { color: var(--pass); } .status.needs h1 { color: var(--ink); }
.status .who { font-size: 16px; color: var(--ink-2); margin-top: 10px; }
.stats { display: flex; gap: 0; border-left: 1px solid var(--line); }
.stat { padding: 0 22px; border-right: 1px solid var(--line); min-width: 92px; }
.stat .n { font-family: var(--serif); font-size: 38px; line-height: 1; letter-spacing: -0.02em; }
.stat .l { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
.stat.p .n, .stat.p .l { color: var(--pass); } .stat.f .n, .stat.f .l { color: var(--flag); } .stat.u .n, .stat.u .l { color: var(--unk); }
.stat.zero .n, .stat.zero .l { color: var(--faint); }
.disc { grid-column: 1 / -1; font-size: 11px; color: var(--faint); margin-top: -8px; }
@media (max-width: 760px) { .status { grid-template-columns: 1fr; } .status h1 { font-size: 36px; } .stats { border-left: 0; } .stat:first-child { padding-left: 0; } }

.alert { border-radius: var(--r); padding: 14px 16px; border: 1px solid; font-size: 13.5px; }
.alert.err { background: var(--flag-bg); border-color: #f1c7c0; color: #6f1a10; }
.alert.warn { background: var(--unk-bg); border-color: #f0dbb0; color: #5a3900; }
.alert b { display: block; margin-bottom: 4px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.stack { display: grid; gap: 10px; }

/* action items */
.actions-list { list-style: none; margin: 16px 0 0; padding: 0; border: 1px solid var(--line); background: var(--surface); }
.ai { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 14px 16px 14px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
.ai.e-Missing, .ai.e-Flagged { border-left-color: var(--flag); } .ai.e-Conflicting { border-left-color: var(--unk); } .ai.e-Unresolved { border-left-color: var(--gray-ln); }
.ai .r { font-family: var(--mono); font-size: 11.5px !important; }
.req { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.ai:last-child { border-bottom: 0; }
.ai .g { padding-top: 1px; }
.ai .t { font-size: 14.5px; }
.ai .t .f { font-weight: 600; }
.ai .r { font-size: 12px; color: var(--muted); margin-top: 2px; }
.g-Missing, .g-Flagged { color: var(--flag); background: var(--flag-bg); border-color: var(--flag-ln) !important; }
.g-Conflicting { color: var(--unk); background: var(--unk-bg); border-color: var(--unk-ln) !important; }
.g-Unresolved { color: var(--gray); background: var(--gray-bg); border-color: var(--gray-ln) !important; }
.tag-ai { border-color: var(--gray-ln) !important; } .tag-tpl, .tag-stale { border-color: var(--unk-ln) !important; } .tag-draft { border-color: var(--flag-ln) !important; }
.allclear { padding: 18px 0; display: flex; gap: 12px; align-items: center; font-size: 15px; }
.allclear .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--pass-bg); color: var(--pass); display: grid; place-items: center; font-weight: 700; }
@media (max-width: 640px) { .ai { grid-template-columns: 1fr; gap: 6px; } }

/* summary */
.summary .snap { font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--ink); max-width: 820px; margin: 16px 0 0; letter-spacing: -0.005em; }
.summary .sl { font: 600 12px/1 var(--mono); color: var(--ink-2); margin-top: 18px; }
.summary .grp { margin-top: 16px; }
.grps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 18px; }
.grps .grp { margin: 0; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; border-top: 3px solid var(--gray-ln); }
.grps .grp.gb-Missing, .grps .grp.gb-Flagged { border-top-color: var(--flag); }
.grps .grp.gb-Missing h3, .grps .grp.gb-Flagged h3 { color: var(--flag); }
.grps .grp.gb-Conflicting { border-top-color: var(--unk); } .grps .grp.gb-Conflicting h3 { color: var(--unk); }
.grps .grp.gb-Overrides { border-top-color: var(--ovr); } .grps .grp.gb-Overrides h3 { color: var(--ovr); }
.summary .grp h3 { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.summary ul { margin: 0; padding-left: 18px; max-width: 860px; }
.summary li { margin: 3px 0; }
.summary .fine { margin-top: 14px; color: var(--faint); font-size: 11.5px; }
.tag-ai { color: var(--ink); background: var(--gray-bg); }
.tag-tpl { color: var(--unk); background: var(--unk-bg); }
.tag-stale { color: var(--unk); background: var(--unk-bg); }

/* rules */
.rule { display: grid; grid-template-columns: 44px minmax(0, 1fr) 130px; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.rule:last-child { border-bottom: 0; }
.rule .id { font: 600 13px/1.6 var(--mono); color: var(--muted); }
.rule .nm { font-weight: 600; }
.rule .why { color: var(--ink-2); margin-top: 2px; }
.rule .in { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font: 11.5px/1.6 var(--mono); color: var(--muted); }
.rule .in span { display: inline-flex; gap: 6px; align-items: center; }
.rule .in code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.rule .st { justify-self: end; }
@media (max-width: 640px) { .rule { grid-template-columns: 36px 1fr; } .rule .st { grid-column: 2; justify-self: start; } }

/* fields */
.field { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 20px; padding: 18px 0 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
.field:last-child { border-bottom: 0; }
.field::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 2px; background: transparent; }
.field.att::before { background: var(--unk); } .field.miss::before { background: var(--flag); } .field.ovr::before { background: var(--ovr); }
.field.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: #fff7e0; } to { background: transparent; } }
.field .lab { font-weight: 600; }
.field .key { font: 11px/1.4 var(--mono); color: var(--faint); margin-top: 2px; }
.field .derived { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.vline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.val { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.val.none { font-weight: 450; color: var(--muted); font-style: italic; font-size: 15px; }
.ev { margin-top: 10px; display: grid; gap: 8px; }
.ev-i { display: grid; gap: 1px; }
.ev-i .loc { font-size: 11.5px; color: var(--muted); }
.ev-i .loc b { color: var(--ink-2); font-weight: 600; }
.ev-i q { quotes: none; font: 12px/1.5 var(--mono); color: var(--ink-2); background: var(--well); border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; justify-self: start; max-width: 100%; overflow-wrap: anywhere; }
.alts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
.alt { border: 1px solid var(--unk-ln); background: var(--unk-bg); border-radius: var(--r); padding: 12px 14px; }
.alt .src { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 8px; border-bottom: 1px solid var(--unk-ln); margin-bottom: 8px; }
.alt .src span { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; white-space: nowrap; }
.alt q.snip { display: inline-block; quotes: none; font: 12px/1.5 var(--mono); color: var(--ink-2); background: var(--well); border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; overflow-wrap: anywhere; }
.alt .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--unk); }
.alt .v { font-size: 20px; font-family: var(--serif); margin: 2px 0 6px; }
.alt.bad { border-color: var(--line); background: var(--hover); }
.vs { font-size: 12px; color: var(--muted); margin-top: 8px; }
.notes { margin: 10px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.orig { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.orig b { color: var(--ink-2); }
.edit { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); }
.edit input { flex: 1; min-width: 160px; }
.edit .elab { flex-basis: 100%; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.edit .msg { flex-basis: 100%; color: var(--flag); font-size: 12.5px; }
.edit .msg:empty { display: none; }
.fbtns { display: flex; gap: 6px; align-items: flex-start; }
.pending { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ovr); }
@media (max-width: 760px) { .field { grid-template-columns: 1fr; gap: 8px; } }

/* inventory */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); }
th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.tbl { overflow-x: auto; }

/* email */
.mail { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); overflow: hidden; margin-top: 16px; }
.mail .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.mail .row .k { color: var(--muted); width: 64px; flex: none; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.mail .row .to { color: var(--muted); }
.mail .row input { border: 0; padding: 4px 0; font-weight: 600; font-size: 14px; background: transparent; }
.mail .row input:focus { box-shadow: none; }
.mail textarea { border: 0; border-radius: 0; min-height: 300px; padding: 16px; font-size: 14px; line-height: 1.6; background: transparent; }
.mail textarea:focus { box-shadow: none; }
.mail .foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--hover); font-size: 12px; color: var(--muted); }
.mail .foot .right { margin-left: auto; }
.tag-draft { color: var(--flag); background: var(--flag-bg); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark" aria-hidden="true">U</div>
    <span class="brand">Submission Review Assistant</span>
    <span class="sep brand-sub" aria-hidden="true">/</span>
    <span class="brand-sub">Commercial auto · readiness for human review</span>
    <div class="spacer"></div>
    <span class="model" title="Model used for extraction and the summary"><span class="mk">Model</span><span class="dot" id="modelDot"></span><span id="modelText">Checking model…</span></span>
  </div>
</header>

<div class="wrap">
  <aside class="side" aria-label="Submission packet">
    <div class="eyebrow">Packet</div>
    <h2>One submission at a time</h2>
    <div class="collapsible">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Add files">
      <b>Drop files or click to browse</b>
      <span>Email .txt/.eml · application &amp; loss runs .pdf · schedule .csv</span>
    </div>
    <input type="file" id="fileInput" multiple class="hidden" accept=".pdf,.csv,.txt,.eml">
    </div>
    <ul class="files" id="fileList"></ul>
    <div class="collapsible">
    <label class="lbl" for="emailText">Or paste the broker email</label>
    <textarea id="emailText" rows="6" placeholder="Optional if the email file is uploaded"></textarea>
    </div>
    <div class="actions">
      <button class="btn primary" id="processBtn">Process submission</button>
      <button class="btn" id="newBtn" title="Clear everything">New</button>
    </div>
  </aside>

  <main class="results" id="results" aria-live="polite"></main>
</div>

<script>
"use strict";
// ------------------------------------------------------------------ state
const S = { files: [], result: null, fields: null, evaluation: null, narrative: null,
            narrativeStale: false, pendingRerun: false, editing: null, req: 0 };
const FIELD_ORDER = ["business_name", "requested_effective_date", "garaging_state", "operations_description",
  "declared_vehicle_count", "operating_radius_miles", "hazardous_materials", "schedule_vehicle_count", "loss_runs_present"];
const DERIVED = { schedule_vehicle_count: "Derived by code from the CSV", loss_runs_present: "Derived by code from the attachment inventory" };
const RULE_SHORT = { R1: "name & effective date", R2: "vehicle count", R3: "radius", R4: "hazardous materials", R5: "loss runs" };
const STATE_WORD = { KNOWN: "Known", MISSING: "Missing", CONFLICT: "Conflict", INVALID: "Invalid", NOT_EXTRACTED: "Not extracted" };
const $ = (id) => document.getElementById(id);

// Build DOM safely: all text goes through textContent (document text is untrusted).
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
const pill = (text, cls, plain) => el("span", { class: "pill " + (cls || text) + (plain ? " plain" : "") }, text);

async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (_) { /* non-JSON */ }
  if (!res.ok) {
    const d = body && body.detail;
    throw new Error(typeof d === "string" ? d : (d ? JSON.stringify(d) : `HTTP ${res.status}`));
  }
  return body;
}
const postJSON = (path, data) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

// ------------------------------------------------------------------ model status
api("/api/config").then((c) => {
  $("modelText").textContent = `${c.provider} · ${c.model}` + (c.key_configured ? "" : " · API key not set");
  $("modelDot").className = "dot " + (c.key_configured ? "ok" : "bad");
}).catch(() => { $("modelText").textContent = "Model config unavailable"; $("modelDot").className = "dot bad"; });

// ------------------------------------------------------------------ packet panel
function renderFiles() {
  $("fileList").replaceChildren(...S.files.map((f, i) => el("li", {},
    el("span", { class: "ext" }, (f.name.split(".").pop() || "?").slice(0, 4)),
    el("span", { class: "name", title: f.name }, f.name),
    el("span", { class: "muted small" }, (f.size / 1024).toFixed(1) + " KB"),
    el("button", { class: "x", title: "Remove", "aria-label": "Remove " + f.name,
      onclick: () => { S.files.splice(i, 1); renderFiles(); } }, "×"))));
}
function addFiles(list) {
  for (const f of list) if (!S.files.some((g) => g.name === f.name && g.size === f.size)) S.files.push(f);
  renderFiles();
}
const drop = $("drop"), input = $("fileInput");
drop.addEventListener("click", () => input.click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

function resetResults() {
  Object.assign(S, { result: null, fields: null, evaluation: null, narrative: null,
                     narrativeStale: false, pendingRerun: false, editing: null });
  S.req++;  // any in-flight response for the old packet is ignored
}
$("newBtn").addEventListener("click", () => {
  resetResults();
  S.files = []; renderFiles(); $("emailText").value = ""; input.value = "";
  render(); window.scrollTo({ top: 0 });
});
$("processBtn").addEventListener("click", processPacket);

async function processPacket() {
  const email = $("emailText").value;
  if (!S.files.length && !email.trim()) { showError("Nothing to process", "Add the submission files and/or paste the broker email."); return; }
  resetResults();  // never show the previous applicant while the new one loads
  const my = S.req;
  const fd = new FormData();
  S.files.forEach((f) => fd.append("files", f, f.name));
  if (email.trim()) fd.append("email_text", email);
  $("processBtn").disabled = true;
  const t0 = performance.now();
  const clock = el("div", { class: "elapsed" }, "0.0 s elapsed");
  const tick = setInterval(() => { clock.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s elapsed"; }, 100);
  const step = (n, text, who) => el("li", {}, el("span", { class: "no" }, n), el("span", {}, text),
    el("span", { class: "who" + (who === "Model" ? " llm" : "") }, who));
  $("results").replaceChildren(el("div", { class: "processing" }, el("div", { class: "spinner" }),
    el("div", { style: "flex:1;min-width:0" }, el("h2", {}, "Reviewing the submission…"),
      el("p", {}, [S.files.length ? `${S.files.length} file(s)` : "", email.trim() ? "pasted email" : ""].filter(Boolean).join(" + ").replace(/^p/, "P") + ". The server runs these steps in order; results appear when all are done (usually 5–30 s)."),
      el("ol", { class: "pipe", "aria-label": "Processing steps" },
        step("01", "Read files and detect each document's type from its heading", "Code"),
        step("02", "Count vehicles in the CSV and check for a loss runs report", "Code"),
        step("03", "Extract the 7 fields from each document, one call per document", "Model"),
        step("04", "Verify every excerpt and value against the source text", "Code"),
        step("05", "Normalize values, reconcile sources, run R1–R5", "Code"),
        step("06", "Write the summary and draft email from the structured result", "Model")),
      clock)));
  try {
    const r = await api("/api/process", { method: "POST", body: fd });
    if (my !== S.req) return;
    S.result = r; S.fields = r.fields; S.narrative = r.narrative;
    S.evaluation = { rules: r.rules, overall_status: r.overall_status, rule_counts: r.rule_counts, issues: r.issues, disclaimer: r.disclaimer };
    render(); toResults();
  } catch (e) {
    if (my !== S.req) return;
    showError("Processing failed", e.message);
  } finally { clearInterval(tick); $("processBtn").disabled = false; }
}
function toResults() {  // wide: top of page; narrow (stacked): top of the results
  const top = $("results").getBoundingClientRect().top + window.scrollY - 70;
  window.scrollTo({ top: window.innerWidth > 980 ? 0 : Math.max(0, top) });
}
function showError(title, msg) {
  $("results").replaceChildren(el("div", { class: "alert err", role: "alert", style: "margin-top:24px" }, el("b", {}, title), msg));
}

// ------------------------------------------------------------------ render
function render() {
  const root = $("results");
  document.body.classList.toggle("has-result", !!S.result);
  if (!S.result) { root.replaceChildren(emptyState()); return; }
  root.replaceChildren(subnav(), statusHero(), failures(), actionItems(), summarySection(),
                       rulesSection(), fieldsSection(), documentsSection(), emailSection());
}

function emptyState() {
  const step = (n, title, text) => el("li", {}, el("span", { class: "no" }, n),
    el("span", { class: "st-t" }, title), el("span", { class: "st-d" }, text));
  return el("div", { class: "hero-empty" },
    el("div", { class: "eyebrow" }, "No submission loaded"),
    el("h1", { style: "margin-top:12px" }, "Review one broker submission"),
    el("p", {}, "Add the broker email, application, vehicle schedule and any loss runs on the left, then choose ",
      el("b", {}, "Process submission"), "."),
    el("ul", { class: "steps" },
      step("01", "Upload", "Add one packet's files, or paste the email."),
      step("02", "Check", "Each value is shown with the line it came from, and the five checks run on the results."),
      step("03", "Resolve", "Correct any value and rerun the checks."),
      step("04", "Follow up", "Copy the draft email to the broker. Nothing is sent.")));
}

function subnav() {
  const n = S.evaluation.issues.length;
  const link = (href, text, cnt) => el("a", { href, onclick: (e) => { e.preventDefault(); jump(href.slice(1)); } }, text,
    cnt ? el("span", { class: "cnt" }, cnt) : null);
  return el("nav", { class: "subnav", "aria-label": "Sections" },
    link("#sec-actions", "Action items", n), link("#sec-summary", "Summary"), link("#sec-rules", "Rules"),
    link("#sec-fields", "Fields & evidence"), link("#sec-docs", "Documents"), link("#sec-email", "Draft email"));
}
function jump(id) {
  const t = $(id); if (!t) return;
  window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 112, behavior: "smooth" });
}

function statusHero() {
  const ev = S.evaluation;
  const ready = ev.overall_status === "READY_FOR_REVIEW";
  const name = S.fields.business_name;
  const who = name && name.resolved ? name.effective_display : "Applicant name not confirmed";
  const which = (st) => ev.rules.filter((x) => x.status === st).map((x) => `${x.id} ${RULE_SHORT[x.id] || x.name}`).join(", ") || "None";
  const cell = (n, title, word, st, cls) => el("div", { class: "cell " + cls + (n === 0 ? " zero" : "") },
    el("div", { class: "lbl2" }, title), el("div", { class: "num" }, el("b", {}, n), el("span", {}, word)),
    el("div", { class: "ex" }, which(st)));
  return el("section", { class: "status " + (ready ? "ready" : "needs"), "aria-label": "Overall status" },
    el("div", { class: "status-top" },
      el("div", {},
        el("div", { class: "eyebrow k" }, "Overall status · " + ev.overall_status),
        el("h1", {}, ready ? "Ready for review" : "Needs review"),
        S.pendingRerun ? el("div", { class: "pending", style: "margin-top:8px" }, "Corrections pending — rerun checks") : null),
      el("div", { class: "who-r" }, who)),
    el("div", { class: "cells" },
      cell(ev.rule_counts.PASS, "Rules passed", "Pass", "PASS", "p"),
      cell(ev.rule_counts.FLAG, "Rules flagged", "Flag", "FLAG", "f"),
      cell(ev.rule_counts.UNKNOWN, "Rules unresolved", "Unknown", "UNKNOWN", "u")),
    el("div", { class: "disc" }, ev.disclaimer));
}

function failures() {
  const r = S.result, failed = r.extraction.filter((x) => x.status !== "ok");
  const box = el("div", { class: "stack" });
  if (failed.length) box.append(el("div", { class: "alert err", role: "alert" },
    el("b", {}, `Model extraction failed for ${failed.length} of ${r.extraction.length} source(s)`),
    el("ul", {}, failed.map((x) => el("li", {}, `${x.source_file}: ${x.message || x.error_kind}`))),
    el("div", { style: "margin-top:6px" }, "Inventory, schedule count and loss runs are still evaluated. Fields that could not be checked are marked Not extracted or not cross-checked — you can enter corrections and rerun the checks.")));
  if (r.warnings.length) box.append(el("div", { class: "alert warn" }, el("b", {}, "Evidence warnings"),
    el("ul", {}, r.warnings.map((w) => el("li", {}, w)))));
  return box.childElementCount ? box : document.createDocumentFragment();
}

// --- action items: the code-built issue list, always current after a rerun
function actionItems() {
  const issues = S.evaluation.issues;
  const body = issues.length
    ? el("ul", { class: "actions-list" }, issues.map((i) => {
        const [head, ...rest] = i.text.split(": ");
        return el("li", { class: "ai e-" + i.group },
          el("div", { class: "g" }, pill(i.group, "g-" + i.group)),
          el("div", {}, el("div", { class: "t" }, el("span", { class: "f" }, head), rest.length ? ": " + rest.join(": ") : ""),
            i.rule_ids.length ? el("div", { class: "r" }, "Affects " + i.rule_ids.join(", ")) : null),
          i.field ? el("button", { class: "btn sm", onclick: () => openField(i.field) }, "Review") : null);
      }))
    : el("div", { class: "allclear" }, el("span", { class: "tick" }, "✓"), "Nothing missing, conflicting or flagged. All five checks pass.");
  return el("section", { id: "sec-actions" },
    el("div", { class: "sec-hd" }, el("h2", {}, "Action items"),
      issues.length ? el("span", { class: "aside" }, `${issues.length} item(s) to resolve before review`) : null),
    body);
}
function openField(name) {
  S.editing = name; render();
  const row = $("f-" + name); if (!row) return;
  window.scrollTo({ top: row.getBoundingClientRect().top + window.scrollY - 120, behavior: "smooth" });
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
}

function summarySection() {
  const n = S.narrative, isModel = n.source === "model";
  const body = el("div", { class: "summary" });
  if (!isModel) body.append(el("div", { class: "alert warn", style: "margin-top:16px" },
    el("b", {}, "Template draft — model unavailable, not AI-generated"),
    (n.error || "").replace(/^Template draft[^.]*\.\s*/, ""),
    n.validation_errors && n.validation_errors.length ? el("ul", {}, n.validation_errors.map((e) => el("li", {}, e))) : null));
  body.append(el("p", { class: "snap" }, n.snapshot), el("div", { class: "sl" }, n.status_line));
  const grps = el("div", { class: "grps" });
  for (const g of n.issue_groups) grps.append(el("div", { class: "grp gb-" + g.group }, el("h3", {}, g.group), el("ul", {}, g.lines.map((l) => el("li", {}, l)))));
  if (n.overrides.length) grps.append(el("div", { class: "grp gb-Overrides" }, el("h3", {}, "Overrides applied"), el("ul", {}, n.overrides.map((l) => el("li", {}, l)))));
  if (grps.childElementCount) body.append(grps);
  return el("section", { id: "sec-summary" },
    el("div", { class: "sec-hd" }, el("h2", {}, "Underwriter summary"),
      isModel ? pill("AI-generated", "tag-ai", true) : pill("Template · not AI-generated", "tag-tpl", true),
      S.narrativeStale ? pill("Stale — checks were rerun", "tag-stale", true) : null,
      el("div", { class: "right" }, el("button", { class: "btn sm", onclick: regenerate, id: "regenBtn" }, "Regenerate"))),
    body);
}

function rulesSection() {
  return el("section", { id: "sec-rules" },
    el("div", { class: "sec-hd" }, el("h2", {}, "Rule checks")),
    S.evaluation.rules.map((r) => el("div", { class: "rule" },
      el("div", { class: "id" }, r.id),
      el("div", {}, el("div", { class: "nm" }, r.name), el("div", { class: "why" }, r.reason),
        el("div", { class: "in" }, r.inputs_used.map((i) => el("span", {},
          `${i.field} = `, fmtVal(i.value), ` · ${(STATE_WORD[i.state] || i.state).toUpperCase()}`,
          i.override ? pill("Human override", "OVERRIDE", true) : null,
          !i.cross_checked ? pill("Not cross-checked", "neutral", true) : null)))),
      el("div", { class: "st" }, pill(`${r.id} ${r.status}`, r.status)))));
}
function fmtVal(v) {
  if (v === null || v === undefined) return el("span", { style: "color:var(--faint)" }, "null");
  return typeof v === "boolean" ? (v ? "true" : "false") : String(v);
}

function evidenceList(evs) {
  if (!evs || !evs.length) return null;
  return el("div", { class: "ev" }, evs.map((e) => el("div", { class: "ev-i" },
    el("span", { class: "loc" }, el("b", {}, e.source_file === "(packet)" ? "Whole packet" : e.source_file), " · " + e.locator),
    el("q", {}, e.excerpt_or_observation))));
}

function fieldsSection() {
  return el("section", { id: "sec-fields" },
    el("div", { class: "sec-hd" }, el("h2", {}, "Fields & evidence"),
      el("div", { class: "right" },
        S.pendingRerun ? el("span", { class: "pending" }, "Corrections pending") : null,
        el("button", { class: "btn primary sm", id: "rerunBtn", onclick: rerun, disabled: !S.pendingRerun }, "Rerun checks"))),
    FIELD_ORDER.filter((k) => S.fields[k]).map((k) => fieldRow(S.fields[k])));
}

function fieldRow(f) {
  const ov = f.override;
  const known = f.effective_state === "KNOWN";
  const cls = ov ? "ovr" : f.state === "MISSING" ? "miss" : (!known || !f.resolved || f.state !== "KNOWN") ? "att" : "";
  const vline = el("div", { class: "vline" },
    known && f.effective_display != null ? el("span", { class: "val" }, f.effective_display)
      : el("span", { class: "val none" }, f.effective_state === "CONFLICT" ? "Unresolved — sources disagree" : f.effective_state === "MISSING" ? (ov ? "Confirmed absent" : "Not found in any source") : "No usable value"),
    ov ? pill("Human override", "OVERRIDE") : pill(STATE_WORD[f.state] || f.state, f.state),
    !ov && f.state === "KNOWN" && !f.cross_checked ? pill("Not cross-checked", "neutral") : null);
  const main = el("div", {}, vline);
  if (ov) main.append(el("div", { class: "orig" }, "Original extraction: ",
    el("b", {}, f.state === "KNOWN" ? (f.display ?? String(f.value)) : (STATE_WORD[f.state] || f.state)), " — kept below for reference."));
  if (f.alternatives.length && f.state === "CONFLICT") {
    main.append(el("div", { class: "alts" }, f.alternatives.map((a, idx) => el("div", { class: "alt" + (a.valid ? "" : " bad") },
      el("div", { class: "src" }, `Source ${String.fromCharCode(65 + idx)} · ` + [...new Set(a.evidence.map((e) => e.source_file))].join(", "),
        a.evidence.length === 1 ? el("span", {}, a.evidence[0].locator) : null),
      el("div", { class: "k" }, a.valid ? "Stated value" : "Unusable value"),
      el("div", { class: "v" }, a.display || "(blank)"),
      !a.valid ? el("div", { class: "small muted" }, a.error || "") : null,
      a.evidence.length === 1 ? el("q", { class: "snip" }, a.evidence[0].excerpt_or_observation) : evidenceList(a.evidence)))));
  } else {
    const evl = evidenceList(f.evidence); if (evl) main.append(evl);
  }
  if (f.notes.length) main.append(el("ul", { class: "notes" }, f.notes.map((n) => el("li", {}, n))));
  if (f.state === "NOT_EXTRACTED" && f.sources_checked.length)
    main.append(el("div", { class: "small muted", style: "margin-top:8px" }, "Sources read successfully: " + f.sources_checked.join(", ")));
  if (S.editing === f.name) main.append(editor(f));

  return el("div", { class: "field " + cls, id: "f-" + f.name },
    el("div", {}, el("div", { class: "lab" }, f.label), el("div", { class: "key" }, f.name),
      DERIVED[f.name] ? el("div", { class: "derived" }, DERIVED[f.name]) : null),
    main,
    el("div", { class: "fbtns" },
      S.editing === f.name ? null : el("button", { class: "btn sm", onclick: () => { S.editing = f.name; render(); } }, ov ? "Edit" : "Correct"),
      ov ? el("button", { class: "btn sm", onclick: () => doOverride(f, { revert: true }) }, "Revert") : null));
}

function editor(f) {
  const inp = el("input", { type: "text", placeholder: hint(f.name), "aria-label": "Corrected value for " + f.label,
    value: f.override && !f.override.confirmed_absent ? f.override.display : "" });
  const msg = el("div", { class: "msg", role: "alert" });
  const save = () => doOverride(f, { value: inp.value }, msg);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") { S.editing = null; render(); } });
  requestAnimationFrame(() => requestAnimationFrame(() => inp.focus({ preventScroll: true })));
  return el("div", { class: "edit" }, el("div", { class: "elab" }, "Reviewer correction"), inp,
    el("button", { class: "btn primary sm", onclick: save }, "Save"),
    el("button", { class: "btn sm", onclick: () => doOverride(f, { confirm_absent: true }, msg) }, "Confirm absent"),
    el("button", { class: "btn sm", onclick: () => { S.editing = null; render(); } }, "Cancel"), msg);
}
function hint(name) {
  return ({ requested_effective_date: "YYYY-MM-DD", garaging_state: "e.g. CA or California", declared_vehicle_count: "Whole number",
    operating_radius_miles: "Miles, e.g. 150", hazardous_materials: "Yes or No", schedule_vehicle_count: "Whole number",
    loss_runs_present: "Yes or No" })[name] || "Corrected value";
}

async function doOverride(f, opts, msgEl) {
  const my = S.req;
  try {
    const updated = await postJSON("/api/override", { field: f, value: opts.value ?? null,
      confirm_absent: !!opts.confirm_absent, revert: !!opts.revert });
    if (my !== S.req) return;
    S.fields = { ...S.fields, [f.name]: updated };
    S.editing = null; S.pendingRerun = true;
    render();
  } catch (e) {
    if (my !== S.req) return;
    if (msgEl) msgEl.textContent = e.message; else alert(e.message);
  }
}

async function rerun() {
  const my = S.req;
  $("rerunBtn").disabled = true;
  try {
    const ev = await postJSON("/api/rerun", { fields: S.fields });
    if (my !== S.req) return;
    S.evaluation = ev; S.pendingRerun = false; S.narrativeStale = true;
    render(); jump("sec-actions");
  } catch (e) { if (my === S.req) alert("Rerun failed: " + e.message); }
}

async function regenerate() {
  const my = S.req, btn = $("regenBtn");
  btn.disabled = true; btn.textContent = "Generating…";
  try {
    const n = await postJSON("/api/narrative", { fields: S.fields });
    if (my !== S.req) return;
    S.narrative = n; S.narrativeStale = false;
    if (S.pendingRerun) {  // narrative is built from the current fields; keep rules in step
      S.evaluation = await postJSON("/api/rerun", { fields: S.fields }); S.pendingRerun = false;
    }
    render();
  } catch (e) { if (my === S.req) { alert("Regenerate failed: " + e.message); btn.disabled = false; btn.textContent = "Regenerate"; } }
}

function documentsSection() {
  const TYPE = { email: "Broker email", application: "Application", loss_runs: "Loss runs report", vehicle_schedule: "Vehicle schedule", unclassified: "Unclassified", unsupported: "Unsupported" };
  const rows = S.result.inventory.map((a) => el("tr", {},
    el("td", {}, el("b", {}, a.filename)), el("td", {}, TYPE[a.detected_type] || a.detected_type),
    el("td", {}, a.readable ? pill("Readable", "PASS", true) : pill("Unreadable", "FLAG", true)),
    el("td", { class: "muted" }, a.pages != null ? a.pages + " page(s)" : a.rows != null ? a.rows + (a.detected_type === "vehicle_schedule" ? " data row(s)" : " line(s)") : "—"),
    el("td", { class: "muted small" }, a.note || "")));
  return el("section", { id: "sec-docs" },
    el("div", { class: "sec-hd" }, el("h2", {}, "Documents received")),
    el("div", { class: "tbl" }, el("table", {},
      el("thead", {}, el("tr", {}, ["File", "Detected as", "Status", "Size", "Note"].map((h) => el("th", {}, h)))),
      el("tbody", {}, rows))));
}

function emailSection() {
  const n = S.narrative;
  const head = el("div", { class: "sec-hd" }, el("h2", {}, "Draft broker email"),
    pill("Draft only — not sent", "tag-draft", true),
    n.source === "model" ? pill("AI-generated", "tag-ai", true) : pill("Template · not AI-generated", "tag-tpl", true),
    S.narrativeStale ? pill("Stale", "tag-stale", true) : null);
  if (!n.email_body) return el("section", { id: "sec-email" }, head,
    el("div", { class: "allclear" }, el("span", { class: "tick" }, "✓"), "No missing, conflicting or flagged items — no broker follow-up needed."));
  return el("section", { id: "sec-email" }, head,
    el("div", { class: "mail" },
      el("div", { class: "row" }, el("span", { class: "k" }, "To"), el("span", { class: "to" }, "Broker — copy into your mail client")),
      el("div", { class: "row" }, el("span", { class: "k" }, "Subject"),
        el("input", { type: "text", id: "draftSubject", "aria-label": "Email subject", value: n.email_subject,
          oninput: (e) => { n.email_subject = e.target.value; } })),
      el("textarea", { id: "draftBody", "aria-label": "Email body", oninput: (e) => { n.email_body = e.target.value; } }, n.email_body),
      el("div", { class: "foot" }, "Editable. Nothing is sent from this app — copy it into your mail client.",
        el("div", { class: "right" }, el("button", { class: "btn primary sm", id: "copyBtn", onclick: copyDraft }, "Copy email")))));
}
async function copyDraft() {
  const subj = $("draftSubject") ? $("draftSubject").value : "", body = $("draftBody") ? $("draftBody").value : "";
  const text = (subj ? "Subject: " + subj + "\n\n" : "") + body;
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = $("draftBody"); if (t) { t.select(); document.execCommand("copy"); } }
  const b = $("copyBtn"); b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy email"; }, 1500);
}

render();
</script>
</body>
</html>
